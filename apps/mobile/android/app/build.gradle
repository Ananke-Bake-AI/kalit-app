apply plugin: 'com.android.application'

android {
    namespace "ai.kalit.studio"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ai.kalit.studio"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing pulled from env vars (CI-friendly) or android/keystore.properties
    // (local dev). Missing config falls back to debug signing so `assembleDebug`
    // never breaks when the keystore isn't set up yet.
    signingConfigs {
        release {
            def storeFileEnv = System.getenv("KALIT_KEYSTORE_FILE")
            def storePasswordEnv = System.getenv("KALIT_KEYSTORE_PASSWORD")
            def keyAliasEnv = System.getenv("KALIT_KEY_ALIAS")
            def keyPasswordEnv = System.getenv("KALIT_KEY_PASSWORD")

            def props = new Properties()
            def propsFile = rootProject.file("keystore.properties")
            if (propsFile.exists()) {
                props.load(new FileInputStream(propsFile))
            }

            def resolvedStoreFile = storeFileEnv ?: props.getProperty("storeFile")
            def resolvedStorePassword = storePasswordEnv ?: props.getProperty("storePassword")
            def resolvedKeyAlias = keyAliasEnv ?: props.getProperty("keyAlias")
            def resolvedKeyPassword = keyPasswordEnv ?: props.getProperty("keyPassword")

            if (resolvedStoreFile && resolvedStorePassword && resolvedKeyAlias && resolvedKeyPassword) {
                // Resolve relative paths from the android/ project root so
                // keystore.properties can keep a short `keystore/foo.jks` form.
                def storeFileResolved = new File(resolvedStoreFile)
                if (!storeFileResolved.isAbsolute()) {
                    storeFileResolved = rootProject.file(resolvedStoreFile)
                }
                storeFile storeFileResolved
                storePassword resolvedStorePassword
                keyAlias resolvedKeyAlias
                keyPassword resolvedKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            def rel = signingConfigs.release
            // Only attach if a real keystore was resolved above — otherwise
            // fall through to unsigned (CI will reject) but keep Gradle happy.
            if (rel.storeFile != null) {
                signingConfig rel
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
