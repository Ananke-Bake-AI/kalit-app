# kalit.ai — landing site, reverse-proxy to the Next.js app on :3004.
#
# Deployed to /etc/nginx/sites-available/kalit.ai on the prod box
# (root@34.107.97.52). Symlinked into /etc/nginx/sites-enabled/.
#
# Recreated 2026-05-23 after the kalit.ai DNS was migrated from
# Vercel back to the GCP origin behind Cloudflare. Without this
# vhost, nginx falls through to whichever server block loads first
# (currently `db-marketing.kalit.ai` aka the Adminer one), so
# kalit.ai/ returned a 200 with `adminer_sid` cookies and every
# /<locale>/* path 404'd because /var/www/adminer/<locale> doesn't
# exist. Symptoms reappear if the file is removed.
#
# To apply:
#   scp ops/nginx/kalit.ai.conf root@34.107.97.52:/etc/nginx/sites-available/kalit.ai
#   ssh root@34.107.97.52 'ln -sf /etc/nginx/sites-available/kalit.ai \
#                            /etc/nginx/sites-enabled/kalit.ai \
#                          && nginx -t && nginx -s reload'

server {
    listen 80;
    listen 443 ssl;
    server_name kalit.ai www.kalit.ai;

    ssl_certificate /etc/nginx/ssl/kalit.crt;
    ssl_certificate_key /etc/nginx/ssl/kalit.key;

    # WebSocket-capable proxy block (matches discovery.kalit.ai shape).
    # Long read timeout because the Studio/Broker WS connection rides
    # the same vhost and we don't want idle-streamed responses to drop.
    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Forward Cloudflare's country header so the currency module
        # (apps/landing/lib/currency.ts) can detect the visitor's
        # currency. Default nginx passthrough preserves it, but being
        # explicit keeps the intent visible — if this line goes away
        # and currency conversion silently breaks, this is the suspect.
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }
}
